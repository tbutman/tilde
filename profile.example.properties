# Copy to profile.local.properties (ignored by git) to seed the profile when the app first starts.
# Everything is optional and can be filled in later under Settings > Profile.
name=Jane Doe
title=Product designer
email=jane@example.com
# What the first sharing option opens; event tags are added to links on this site.
website=https://example.com/hello
# Shown after the ~/ mark on the Share screen.
handle=janedoe
linkedin=https://www.linkedin.com/in/janedoe
github=https://github.com/janedoe
instagram=https://www.instagram.com/janedoe/
x=https://x.com/janedoe
# Phone numbers go on the contact card, shared only in person.
phone.1.label=mobile
phone.1.number=+1 555 0100
# Optional: the number the WhatsApp option opens a chat with.
whatsapp.number=+1 555 0100
