name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TILDE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The TILDE_KEYSTORE_BASE64 secret is missing; see docs/DEVELOPMENT.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tilde.jks"

      - name: Test and build
        env:
          TILDE_STORE_FILE: ${{ runner.temp }}/tilde.jks
          TILDE_STORE_PASSWORD: ${{ secrets.TILDE_STORE_PASSWORD }}
          TILDE_KEY_ALIAS: ${{ secrets.TILDE_KEY_ALIAS }}
          TILDE_KEY_PASSWORD: ${{ secrets.TILDE_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Tilde-$VERSION.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md ("## 1.0.0 (date)").
          awk -v h="## $VERSION" 'index($0, h " ") == 1 || $0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          # Versions with a hyphen (1.0.0-beta.1) are pre-releases: not shown as the latest release.
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "Tilde-$VERSION.apk" --title "Tilde $VERSION" --notes-file notes.md "${prerelease[@]}"
